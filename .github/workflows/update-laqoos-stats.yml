name: Update LaQoos Genshin statistics
on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/updateLaqoosStats.js
      - name: Commit verified snapshot
        run: |
          if git diff --quiet -- data/genshinStats.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/genshinStats.json
          git commit -m "data: refresh LaQoos Genshin stats"
          git push
