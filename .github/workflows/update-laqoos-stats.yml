name: Diagnose LaQoos Genshin statistics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/updateLaqoosStats.js
      - run: node scripts/renderGenshinStats.js
      - uses: actions/upload-artifact@v4
        with:
          name: laqoos-diagnostic
          path: |
            data/genshinStats.json
            data/stats-pull.png
            data/stats-usage.png
