<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>DEVICE SPEC</title><style>body{margin:0;background:#101216;color:#e9edf3;font:15px system-ui,-apple-system,sans-serif}main{max-width:620px;margin:48px auto;padding:0 20px}h1{font-size:32px;letter-spacing:.08em;margin-bottom:5px}p{color:#a6adba;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:25px 0}.tile{background:#1b1e25;border:1px solid #343945;border-radius:14px;padding:17px;min-width:0}.label{font-size:11px;color:#9fa8b9;letter-spacing:.12em}.value{font-size:16px;font-weight:650;overflow-wrap:anywhere;margin-top:9px}button{border:0;border-radius:10px;padding:14px 18px;background:#dce6fa;color:#15191f;font-weight:700;cursor:pointer;margin:0 8px 8px 0}button:disabled{opacity:.5}#result{white-space:pre-wrap;color:#a6adba}small{color:#8d96a6}@media(max-width:420px){.grid{grid-template-columns:1fr}main{margin:28px auto}}</style></head><body><main><h1>DEVICE SPEC</h1><p>ブラウザから確認できる端末情報を表示します。端末情報はサーバーへ送信・保存しません。取得できない項目は「取得不可」と表示します。</p><div class="grid" id="grid"></div><button id="bench">簡易ベンチマークを実行</button><button id="copy">結果をコピー</button><p id="result">※ ベンチマークは端末に一時的な負荷をかけます。結果はブラウザ間で厳密に比較できません。</p><small>CPU/GPUの正確な型番、実RAM容量などはブラウザの制限により取得できないことがあります。</small></main><script>
const grid=document.getElementById('grid'),values={};function add(k,v){values[k]=v??'取得不可';const e=document.createElement('div');e.className='tile';const l=document.createElement('div');l.className='label';l.textContent=k;const a=document.createElement('div');a.className='value';a.textContent=values[k];e.append(l,a);grid.append(e)}
const ua=navigator.userAgent;let os=/Android/i.test(ua)?'Android':/iPhone|iPad/i.test(ua)?'iOS / iPadOS':/Windows/i.test(ua)?'Windows':/Mac OS X/i.test(ua)?'macOS':/Linux/i.test(ua)?'Linux':'取得不可';let browser=/Edg\//.test(ua)?'Edge':/Firefox\//.test(ua)?'Firefox':/Chrome\//.test(ua)?'Chrome':/Safari\//.test(ua)?'Safari':'取得不可';
add('OS',os);add('BROWSER',browser);add('CPU THREADS',navigator.hardwareConcurrency?String(navigator.hardwareConcurrency)+' 論理コア':'取得不可');add('MEMORY (推定)',navigator.deviceMemory?String(navigator.deviceMemory)+' GB (概算)':'取得不可');add('SCREEN',screen.width+' × '+screen.height+' CSS px');add('PIXEL RATIO',String(devicePixelRatio||1));
let gpu='取得不可';try{const canvas=document.createElement('canvas');const gl=canvas.getContext('webgl');const ext=gl&&gl.getExtension('WEBGL_debug_renderer_info');if(ext)gpu=gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)||gpu}catch(e){}add('GPU (WebGL)',gpu);
let score=null;document.getElementById('bench').onclick=async()=>{const b=document.getElementById('bench');b.disabled=true;document.getElementById('result').textContent='測定中…';await new Promise(r=>setTimeout(r,60));const start=performance.now();let n=0,x=0;while(performance.now()-start<700){for(let i=0;i<500;i++){x+=Math.sqrt((i+n)%1000)}n+=500}score=Math.round(n/((performance.now()-start)/1000));document.getElementById('result').textContent='簡易CPU演算: '+score.toLocaleString()+' 回/秒（参考値）';b.disabled=false};
document.getElementById('copy').onclick=async()=>{const lines=['DEVICE SPEC',...Object.entries(values).map(([k,v])=>k+': '+v),score===null?'':'簡易CPU演算: '+score.toLocaleString()+' 回/秒（参考値）'].filter(Boolean).join('\n');try{await navigator.clipboard.writeText(lines);document.getElementById('result').textContent='結果をコピーしました。Discordに貼り付けられます。'}catch(e){document.getElementById('result').textContent='コピーできませんでした。ブラウザの権限をご確認ください。'}};
</script></body></html>
